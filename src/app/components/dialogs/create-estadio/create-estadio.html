<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '420px', borderRadius: '20px' }"
  [contentStyle]="{ padding: '0' }"
>
  <ng-template pTemplate="header">
    <div class="dialog-header">
      <span class="dialog-title">CREAR ESTADIO</span>
    </div>
  </ng-template>

  <div class="dialog-body">
    <form [formGroup]="form">
      <label class="field-label">Descripción</label>
      <input
        pInputText
        type="text"
        placeholder="Ej: Estadio Nacional"
        formControlName="descripcion"
        class="field-input"
        [class.input-error]="isInvalid('descripcion')"
      />
      <span class="error-msg" *ngIf="hasError('descripcion', 'required')">Campo requerido</span>

      <label class="field-label">Estado</label>
      <p-select
        formControlName="estado"
        [options]="estados"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona un estado"
        styleClass="field-select"
        appendTo="body"
        [class.input-error]="isInvalid('estado')"
        scrollHeight="150px"
      >
      </p-select>
      <span class="error-msg" *ngIf="hasError('estado', 'required')">Selecciona un estado</span>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button label="Cancelar" severity="secondary" (onClick)="cancelar()"></p-button>
      <p-button label="Crear Estadio" (onClick)="onSubmit()" [disabled]="loading"></p-button>
    </div>
  </ng-template>
</p-dialog>
