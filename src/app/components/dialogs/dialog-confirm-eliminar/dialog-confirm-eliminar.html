<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '400px' }">

  <ng-template pTemplate="header">
    <div class="dialog-header">
      <span class="dialog-title">⚠️ ELIMINAR USUARIO</span>
    </div>
  </ng-template>

  <div class="dialog-body">
    <p class="confirm-msg">¿Está seguro de eliminar este usuario?</p>
    <p class="confirm-warn">Esta acción no se puede deshacer.</p>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button
        label="Cancelar"
        severity="secondary"
        icon="pi pi-times"
        (onClick)="cancelar()"
        [disabled]="loading">
      </p-button>
      <p-button
        label="Eliminar definitivamente"
        severity="danger"
        icon="pi pi-trash"
        (onClick)="eliminar()"
        [loading]="loading">
      </p-button>
    </div>
  </ng-template>

</p-dialog>
