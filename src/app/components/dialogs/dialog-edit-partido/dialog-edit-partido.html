<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '480px', borderRadius: '20px' }"
  [contentStyle]="{ padding: '0' }"
>
  <ng-template pTemplate="header">
    <div class="dialog-header">
      <span class="dialog-title">EDITAR PARTIDO</span>
    </div>
  </ng-template>

  <div class="dialog-body">
    <form [formGroup]="form">
      <label class="field-label">Equipo Local</label>
      <p-select
        formControlName="idEquipoLocal"
        [options]="equipos"
        optionLabel="nombre"
        optionValue="idEquipo"
        placeholder="Selecciona equipo local"
        styleClass="field-select"
        appendTo="body"
        [class.input-error]="isInvalid('idEquipoLocal')"
        scrollHeight="200px"
      >
      </p-select>
      <span class="error-msg" *ngIf="hasError('idEquipoLocal', 'required')">Selecciona un equipo</span>

      <label class="field-label">Equipo Visitante</label>
      <p-select
        formControlName="idEquipoVisitante"
        [options]="equipos"
        optionLabel="nombre"
        optionValue="idEquipo"
        placeholder="Selecciona equipo visitante"
        styleClass="field-select"
        appendTo="body"
        [class.input-error]="isInvalid('idEquipoVisitante')"
        scrollHeight="200px"
      >
      </p-select>
      <span class="error-msg" *ngIf="hasError('idEquipoVisitante', 'required')">Selecciona un equipo</span>
      <span class="error-msg" *ngIf="form.hasError('equiposIguales') && (form.get('idEquipoVisitante')?.touched || form.get('idEquipoLocal')?.touched)">
        El equipo visitante debe ser diferente al local
      </span>

      <label class="field-label">Fase</label>
      <p-select
        formControlName="fase"
        [options]="fases"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona una fase"
        styleClass="field-select"
        appendTo="body"
        [class.input-error]="isInvalid('fase')"
        scrollHeight="200px"
      >
      </p-select>
      <span class="error-msg" *ngIf="hasError('fase', 'required')">Selecciona una fase</span>

      <div class="goles-row">
        <div class="goles-col">
          <label class="field-label">Goles Local</label>
          <p-inputNumber
            formControlName="golesLocal"
            [min]="0"
            [useGrouping]="false"
            [showButtons]="true"
            buttonLayout="horizontal"
            decrementButtonClass="p-button-secondary"
            incrementButtonClass="p-button-secondary"
            [class.input-error]="isInvalid('golesLocal')"
            styleClass="field-input-number"
          >
          </p-inputNumber>
          <span class="error-msg" *ngIf="hasError('golesLocal', 'required')">Campo requerido</span>
          <span class="error-msg" *ngIf="hasError('golesLocal', 'min')">No puede ser negativo</span>
        </div>
        <div class="goles-col">
          <label class="field-label">Goles Visitante</label>
          <p-inputNumber
            formControlName="golesVisitante"
            [min]="0"
            [useGrouping]="false"
            [showButtons]="true"
            buttonLayout="horizontal"
            decrementButtonClass="p-button-secondary"
            incrementButtonClass="p-button-secondary"
            [class.input-error]="isInvalid('golesVisitante')"
            styleClass="field-input-number"
          >
          </p-inputNumber>
          <span class="error-msg" *ngIf="hasError('golesVisitante', 'required')">Campo requerido</span>
          <span class="error-msg" *ngIf="hasError('golesVisitante', 'min')">No puede ser negativo</span>
        </div>
      </div>

      <label class="field-label">Fecha y Hora</label>
      <p-datepicker
        formControlName="fechaHora"
        [showTime]="true"
        [hourFormat]="'24'"
        [minDate]="minDate"
        placeholder="Selecciona fecha y hora"
        styleClass="field-datepicker"
        appendTo="body"
        [class.input-error]="isInvalid('fechaHora')"
      >
      </p-datepicker>
      <span class="error-msg" *ngIf="hasError('fechaHora', 'required')">Selecciona fecha y hora</span>

      <label class="field-label">Estado</label>
      <p-select
        formControlName="estado"
        [options]="estados"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona un estado"
        styleClass="field-select"
        appendTo="body"
        [class.input-error]="isInvalid('estado')"
      >
      </p-select>
      <span class="error-msg" *ngIf="hasError('estado', 'required')">Selecciona un estado</span>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button label="Cancelar" severity="secondary" (onClick)="cancelar()"></p-button>
      <p-button label="Guardar Cambios" (onClick)="onSubmit()" [disabled]="loading"></p-button>
    </div>
  </ng-template>
</p-dialog>
