<div class="equipo-wrapper">
  <div class="table-header">
    <h2 class="table-title">LISTA EQUIPOS</h2>
  </div>

  <div class="search-wrapper">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar equipo...</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="ID, nombre, grupo, entrenador..."
        #input
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="equipos" class="equipos-table">
      <ng-container matColumnDef="bandera">
        <th mat-header-cell *matHeaderCellDef>Bandera</th>
        <td mat-cell *matCellDef="let equipo">
          <img [src]="equipo.bandera" />
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>EQUIPO</th>
        <td mat-cell *matCellDef="let equipo">{{ equipo.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="idGrupo">
        <th mat-header-cell *matHeaderCellDef>GRUPO</th>
        <td mat-cell *matCellDef="let equipo">{{ getGrupoNombre(equipo.idGrupo) }}</td>
      </ng-container>

      <ng-container matColumnDef="entrenador">
        <th mat-header-cell *matHeaderCellDef>ENTRENADOR</th>
        <td mat-cell *matCellDef="let equipo">{{ equipo.entrenador }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>ESTADO</th>
        <td mat-cell *matCellDef="let equipo">{{ getEstadoNombre(equipo.estado) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <mat-icon>search_off</mat-icon>
          No se encontraron resultados para "<strong>{{ input.value }}</strong>"
        </td>
      </tr>
    </table>
  </div>
</div>
