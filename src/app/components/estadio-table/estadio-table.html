<div class="estadio-wrapper">
  <div class="table-header">
    <h2 class="table-title">LISTA ESTADIOS</h2>
    <div class="header-buttons">
      <button mat-flat-button class="btn-crear" (click)="dialogCrear.abrir()">
        <mat-icon>add_location</mat-icon>
        CREAR ESTADIO
      </button>
    </div>
  </div>

  <div class="search-wrapper">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar estadio...</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="ID, descripción, estado..." #input />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="estadios" class="estadios-table">
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>DESCRIPCIÓN</th>
        <td mat-cell *matCellDef="let estadio">{{ estadio.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>ESTADO</th>
        <td mat-cell *matCellDef="let estadio">{{ getEstadoNombre(estadio.estado) }}</td>
      </ng-container>

      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef>EDITAR</th>
        <td mat-cell *matCellDef="let estadio">
          <button
            mat-icon-button
            class="btn-editar"
            (click)="dialogEditar.abrir(estadio.idEstadio, estadio.descripcion, estadio.estado)"
            matTooltip="Editar estadio"
          >
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>ELIMINAR</th>
        <td mat-cell *matCellDef="let estadio">
          <button
            mat-icon-button
            class="btn-eliminar"
            matTooltip="Eliminar estadio"
            (click)="onAbrirEliminar(estadio)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <mat-icon>search_off</mat-icon>
          No se encontraron resultados para "<strong>{{ input.value }}</strong>"
        </td>
      </tr>
    </table>
  </div>

  <app-create-estadio #dialogCrear (estadioCreado)="onEstadioCreado($event)"></app-create-estadio>
  <app-dialog-edit-estadio
    #dialogEditar
    (estadioEditado)="onEstadioEditado($event)"
  ></app-dialog-edit-estadio>
  <app-dialog-confirm-eliminar
    #dialogConfirm
    (confirmarEliminar)="onEliminarEstadio($event)"
  ></app-dialog-confirm-eliminar>
</div>
